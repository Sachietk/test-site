<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Google Sites Embed Test</title>


<style>

/* =========================================================
   ABSOLUTE RESET
   ========================================================= */

html {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;
}


body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #171717;
}


* {
    box-sizing: border-box;
}


/* =========================================================
   MAIN SITE
   ========================================================= */

.site {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: white;
}


/* =========================================================
   HERO
   ========================================================= */

.hero {

    width: 100%;
    height: 100%;

    min-height: 500px;

    margin: 0;
    padding: 40px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(214, 164, 73, 0.16),
            transparent 55%
        );

    overflow: hidden;
}


.hero h1 {

    margin: 0;

    font-size:
        clamp(45px, 8vw, 90px);

    line-height: 0.95;

    letter-spacing: -3px;

    animation:
        fadeIn 0.8s ease;
}


.hero h1 span {

    color: #d6a449;

}


.hero p {

    max-width: 650px;

    margin:
        25px 0 0;

    color: #666;

    font-size: 18px;

    line-height: 1.6;

}


.hero-button {

    margin-top: 30px;

    padding:
        13px 25px;

    border: none;

    border-radius: 100px;

    background: #d6a449;

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform 0.2s,
        box-shadow 0.2s;
}


.hero-button:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 10px 30px
        rgba(214,164,73,0.3);
}


/* =========================================================
   MESSAGE
   ========================================================= */

#message {

    height: 25px;

    margin-top: 15px !important;

    color: #777;

    font-size: 14px !important;

}


/* =========================================================
   JAVASCRIPT DEMO
   ========================================================= */

.demo {

    position: absolute;

    right: 25px;
    bottom: 25px;

    padding:
        12px 18px;

    display: flex;

    align-items: center;

    gap: 12px;

    background:
        rgba(255,255,255,0.9);

    border:
        1px solid #ddd;

    border-radius: 12px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.08);
}


.demo-label {

    font-size: 13px;

    color: #777;
}


#counter {

    font-weight: bold;

    color: #d6a449;

}


.demo button {

    border: none;

    padding:
        6px 10px;

    border-radius: 6px;

    background: #171717;

    color: white;

    cursor: pointer;
}


/* =========================================================
   ANIMATION
   ========================================================= */

@keyframes fadeIn {

    from {

        opacity: 0;

        transform:
            translateY(20px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .hero {

        padding:
            25px;

    }


    .hero h1 {

        font-size:
            clamp(40px, 13vw, 65px);

    }


    .hero p {

        font-size: 16px;

    }


    .demo {

        right: 15px;

        bottom: 15px;

    }

}

</style>

</head>


<body>


<div class="site">


    <!-- =====================================================
         HERO
         ===================================================== -->

    <section class="hero">

        <h1>

            Your
            <span>Website</span>

        </h1>


        <p>

            This is a completely custom HTML,
            CSS and JavaScript page embedded
            inside Google Sites.

        </p>


        <button
            class="hero-button"
            onclick="showMessage()"
        >

            Test JavaScript

        </button>


        <p id="message"></p>


        <!-- =================================================
             SMALL JAVASCRIPT TEST
             ================================================= -->

        <div class="demo">

            <span class="demo-label">
                Counter
            </span>


            <span id="counter">
                0
            </span>


            <button
                onclick="increment()"
            >

                +

            </button>

        </div>


    </section>


</div>



<script>

/* =========================================================
   JAVASCRIPT TEST 1
   ========================================================= */

function showMessage() {

    document
        .getElementById("message")
        .textContent =
        "JavaScript works!";

}


/* =========================================================
   JAVASCRIPT TEST 2
   ========================================================= */

let count = 0;


function increment() {

    count++;

    document
        .getElementById("counter")
        .textContent =
        count;

}

</script>


</body>

</html>
```
